<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#240b18">
<title>Senin için bir buket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#240b18; --wine2:#431529; --tulip:#e0243a; --blush:#f7c6cc;
  --paper:#f8eedf; --gold:#e8b657; --ink:#7a1230;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 38%,var(--wine2) 0%,var(--wine) 62%,#150610 100%);
  color:var(--blush);font-family:var(--serif);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:relative;z-index:2;height:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:16px}
.stage[hidden]{display:none}

/* ---------- Gift stage ---------- */
#gift{transition:opacity .6s ease,transform .6s ease}
#gift.leave{opacity:0;transform:translateY(-28px) scale(.96);pointer-events:none}
#bouquet{height:min(62vh,520px);width:auto;max-width:92vw;overflow:visible;
  filter:drop-shadow(0 24px 30px rgba(0,0,0,.45))}
.stem{fill:none;stroke:#3d7f52;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1s ease-out var(--d) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bloom{transform-origin:0 0;animation:bloom 1.1s cubic-bezier(.2,.9,.3,1.25) var(--d) both}
@keyframes bloom{from{transform:scale(0);opacity:0}50%{opacity:1}to{transform:scale(1);opacity:1}}
.leaf{transform-origin:200px 430px;animation:grow 1s cubic-bezier(.2,.8,.3,1) var(--d) both}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.wrap{animation:rise .9s ease 0s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.btn{
  position:relative;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1rem,4.4vw,1.2rem);
  color:var(--wine);background:var(--blush);border:0;border-radius:999px;padding:.95em 1.9em;cursor:pointer;
  box-shadow:0 10px 28px -8px rgba(224,36,58,.55);
  opacity:0;animation:rise .8s ease 2.3s forwards;
  transition:transform .2s ease,background .2s ease;
}
.btn::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--blush);
  opacity:0;animation:ring 2.4s ease-out 3.2s infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
.btn:hover{transform:translateY(-2px);background:#fff}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

/* ---------- Note stage ---------- */
#note{perspective:900px}
.hint{font-style:italic;font-weight:500;font-size:clamp(1rem,4vw,1.15rem);color:var(--blush);opacity:.9;
  text-align:center;transition:opacity .5s ease}
#note.done .hint{opacity:0}
.card{
  position:relative;width:min(88vw,480px);aspect-ratio:1.5;background:var(--paper);border-radius:8px;
  display:grid;place-items:center;overflow:hidden;transform:rotate(-1.5deg);
  box-shadow:0 36px 60px -24px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.4) inset;
  animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
  background-image:
    radial-gradient(120% 100% at 20% 0%,rgba(255,255,255,.65),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(122,18,48,.06) 31px 32px);
}
@keyframes cardIn{
  from{opacity:0;transform:perspective(900px) rotateX(35deg) translateY(50px) rotate(-1.5deg)}
  to{opacity:1;transform:perspective(900px) rotateX(0) translateY(0) rotate(-1.5deg)}
}
.card::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(224,36,58,.35);border-radius:4px;pointer-events:none}
.msg{font-family:var(--hand);font-weight:700;color:var(--ink);text-align:center;
  font-size:clamp(2rem,9vw,3.4rem);line-height:1.12;padding:0 8%;margin-top:-6%}
.sprig{position:absolute;bottom:7%;left:50%;width:34px;transform:translateX(-50%);opacity:.9}
#foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;
  transition:opacity .9s ease}
#foil.hide{opacity:0;pointer-events:none}
.card.done .msg{animation:glow 2.4s ease .2s 1}
@keyframes glow{0%,100%{text-shadow:none}40%{text-shadow:0 0 22px rgba(224,36,58,.55),0 0 2px rgba(224,36,58,.6)}}
.actions{display:flex;gap:18px;min-height:2.2em}
.link{font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--blush);opacity:.7;
  background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:.4em .2em}
.link:hover{opacity:1}
.link[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<main>
  <section id="gift" class="stage">
    <svg id="bouquet" viewBox="0 30 400 490" role="img" aria-label="Kırmızı laleler, şakayık ve papatyalardan oluşan bir buket"></svg>
    <button id="open" class="btn" type="button">Hediyenizi görmek için tıklayın</button>
  </section>

  <section id="note" class="stage" hidden>
    <p class="hint">Altında bir not var. Kazı.</p>
    <div class="card" id="card">
      <p class="msg">Kalbimin orta yerinde<br>bu nasıl bir cumhuriyet</p>
      <svg class="sprig" viewBox="-30 -82 60 100" aria-hidden="true">
        <path d="M0 16 C0 2 2 -4 0 -12" stroke="#3d7f52" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M-20,-6 C-26,-40 -10,-62 0,-72 C10,-62 26,-40 20,-6 C10,6 -10,6 -20,-6Z" fill="#a30f20"/>
        <path d="M-22,-8 C-30,-44 -14,-66 -4,-74 C-8,-50 -4,-20 6,2 C-6,6 -16,2 -22,-8Z" fill="#e0243a"/>
        <path d="M22,-8 C30,-44 14,-66 4,-74 C8,-50 4,-20 -6,2 C6,6 16,2 22,-8Z" fill="#ff5266"/>
      </svg>
      <canvas id="foil" role="img" aria-label="Kazınabilir gümüş katman"></canvas>
    </div>
    <div class="actions">
      <button id="skip" class="link" type="button">Kazımadan aç</button>
      <button id="replay" class="link" type="button" hidden>Baştan kazı</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =====================================================
     1) Buket (SVG, JS ile üretiliyor)
  ===================================================== */
  let defs = '', stems = '', fill = '', gid = 0;
  const rad = d => d * Math.PI / 180;

  function stem(ax, ay, rot, w, d) {
    const L = 110, c2x = ax - L * Math.sin(rad(rot)), c2y = ay + L * Math.cos(rad(rot));
    const c1x = 200 + (ax - 200) * 0.12;
    stems += `<path class="stem" pathLength="1" stroke-width="${w}" style="--d:${d}ms" ` +
             `d="M200 448 C${c1x} 370 ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${ax} ${ay}"/>`;
  }

  function tulip(o) {
    const id = 'g' + (gid++);
    defs += `<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="${o.c2}"/><stop offset="1" stop-color="${o.c1}"/></linearGradient>`;
    return `<g transform="translate(${o.x} ${o.y}) rotate(${o.rot}) scale(${o.s})"><g class="bloom" style="--d:${o.hd}ms">
      <path d="M-20,-6 C-26,-40 -10,-62 0,-72 C10,-62 26,-40 20,-6 C10,6 -10,6 -20,-6Z" fill="${o.c2}"/>
      <path d="M-22,-8 C-30,-44 -14,-66 -4,-74 C-8,-50 -4,-20 6,2 C-6,6 -16,2 -22,-8Z" fill="url(#${id})"/>
      <path d="M22,-8 C30,-44 14,-66 4,-74 C8,-50 4,-20 -6,2 C6,6 16,2 22,-8Z" fill="url(#${id})"/>
      <path d="M-4,-74 C-8,-50 -4,-20 6,2" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>
    </g></g>`;
  }

  function daisy(o) {
    const n = 14, r = o.r; let p = '';
    for (let i = 0; i < n; i++)
      p += `<ellipse cx="0" cy="${-r * .62}" rx="${r * .2}" ry="${r * .42}" transform="rotate(${i * 360 / n})"/>`;
    return `<g transform="translate(${o.x} ${o.y})"><g class="bloom" style="--d:${o.hd}ms">
      <g fill="#fffaf2" stroke="rgba(160,120,120,.35)" stroke-width=".8">${p}</g>
      <circle r="${r * .27}" fill="${o.center}"/><circle r="${r * .27}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>
    </g></g>`;
  }

  function peony(o) {
    const r = o.r, rings = [[.62, .44, 9, '#f6b3c2'], [.42, .36, 8, '#ee8aa4'], [.22, .28, 6, '#d9557b']];
    let p = '';
    rings.forEach(([rr, sz, n, c], k) => {
      for (let i = 0; i < n; i++) {
        const a = rad(i * 360 / n + k * 22);
        p += `<circle cx="${(Math.cos(a) * rr * r).toFixed(1)}" cy="${(Math.sin(a) * rr * r).toFixed(1)}" r="${(sz * r).toFixed(1)}" fill="${c}" stroke="rgba(150,30,70,.3)" stroke-width=".8"/>`;
      }
    });
    return `<g transform="translate(${o.x} ${o.y})"><g class="bloom" style="--d:${o.hd}ms">${p}
      <circle r="${r * .16}" fill="#b8305a"/></g></g>`;
  }

  function filler(x, y, d) {
    stem(x, y, 0, 1.6, d);
    let c = '';
    [[0, 0], [5, -3], [-5, -2], [2, 5], [-3, 5], [0, -7]].forEach(([dx, dy]) =>
      c += `<circle cx="${dx}" cy="${dy}" r="2.8"/>`);
    return `<g transform="translate(${x} ${y})"><g class="bloom" style="--d:${d + 500}ms" fill="#fff" opacity=".92">${c}</g></g>`;
  }

  const flowers = [
    {t:'tulip', x:200, y:165, rot:0,   s:1.2,  c1:'#ff5266', c2:'#b3121f'},
    {t:'tulip', x:138, y:190, rot:-15, s:1.05, c1:'#f23a52', c2:'#8f0f1f'},
    {t:'tulip', x:264, y:188, rot:15,  s:1.05, c1:'#ff6a5a', c2:'#c0281f'},
    {t:'tulip', x:92,  y:245, rot:-33, s:.95,  c1:'#ff5266', c2:'#a30f20'},
    {t:'tulip', x:310, y:243, rot:33,  s:.95,  c1:'#f23a52', c2:'#9a0f20'},
    {t:'peony', x:168, y:248, r:36},
    {t:'daisy', x:240, y:254, r:30, center:'#f2b73f'},
    {t:'daisy', x:118, y:292, r:22, center:'#e0243a'},
    {t:'daisy', x:284, y:296, r:22, center:'#f2b73f'}
  ].sort((a, b) => a.y - b.y);

  let heads = '';
  flowers.forEach((f, i) => {
    f.hd = 700 + i * 130;
    stem(f.x, f.y, f.rot || 0, f.t === 'tulip' ? 5 : 4.2, i * 90);
    heads += f.t === 'tulip' ? tulip(f) : f.t === 'daisy' ? daisy(f) : peony(f);
  });

  let fillers = '';
  [[62,285],[346,282],[125,120],[287,116],[168,92],[236,88],[336,190],[64,190],[212,60]]
    .forEach(([x, y], i) => fillers += filler(x, y, 300 + i * 70));

  const leaf = (d, delay) => `<g class="leaf" style="--d:${delay}ms"><path d="${d}" fill="url(#leafG)"/></g>`;
  const leaves =
    leaf('M200,410 C150,390 100,340 78,262 C128,270 182,320 200,410Z', 200) +
    leaf('M200,410 C250,390 300,340 322,262 C272,270 218,320 200,410Z', 260) +
    leaf('M198,390 C170,350 150,310 148,268 C176,292 196,330 198,390Z', 340) +
    leaf('M202,390 C230,350 250,310 252,268 C224,292 204,330 202,390Z', 400);

  const staticDefs = `
    <linearGradient id="leafG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2d6340"/><stop offset="1" stop-color="#58a574"/></linearGradient>
    <linearGradient id="paperG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf1e2"/><stop offset=".55" stop-color="#f3e2cb"/><stop offset="1" stop-color="#dcc3a3"/></linearGradient>
    <linearGradient id="ribG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a5e"/><stop offset="1" stop-color="#b3121f"/></linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#e0243a" opacity=".28"/><circle cx="10" cy="10" r="1.2" fill="#e8b657" opacity=".55"/></pattern>`;

  const cone = 'M100,322 Q200,350 300,322 L226,506 Q200,514 174,506Z';
  const paper = `<g class="wrap">
    <ellipse cx="200" cy="512" rx="62" ry="7" fill="rgba(0,0,0,.35)"/>
    <path d="${cone}" fill="url(#paperG)"/>
    <path d="${cone}" fill="url(#dots)"/>
    <path d="M100,322 Q152,344 214,342 L182,508 L174,506Z" fill="rgba(255,255,255,.38)"/>
    <path d="M214,342 L182,508" stroke="rgba(120,80,50,.25)" stroke-width="1.2" fill="none"/>
    <path d="M100,322 Q200,350 300,322" fill="none" stroke="rgba(120,80,50,.25)" stroke-width="1.4"/>
    <path d="M118,364 Q200,392 282,364 L279,382 Q200,410 121,382Z" fill="url(#ribG)"/>
    <path d="M200,392 C160,360 140,398 168,414 C180,420 196,402 200,392Z" fill="url(#ribG)"/>
    <path d="M200,392 C240,360 260,398 232,414 C220,420 204,402 200,392Z" fill="url(#ribG)"/>
    <path d="M195,400 L176,448 L192,441 L199,456 L206,400Z" fill="#b3121f"/>
    <path d="M205,400 L224,448 L208,441 L201,456 L194,400Z" fill="#d11a2d"/>
    <circle cx="200" cy="394" r="9" fill="#ff4a5e"/>
  </g>`;

  $('#bouquet').innerHTML =
    `<defs>${staticDefs}${defs}</defs>
     <g>${stems}</g>${fillers}${leaves}${heads}${paper}`;

  /* =====================================================
     2) Yaprak / konfeti kanvası
  ===================================================== */
  const pc = $('#petals'), px = pc.getContext('2d');
  let W = 0, H = 0;
  const COLORS = ['#e0243a', '#f06a80', '#f7c6cc', '#ffffff', '#e8b657', '#ff8fa3'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = () => COLORS[(Math.random() * COLORS.length) | 0];
  let petals = [];

  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    pc.width = W * dpr; pc.height = H * dpr;
    px.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const ambient = (top) => ({
    x: rnd(0, W), y: top ? rnd(-H * .3, -10) : rnd(0, H), vx: 0, vy: rnd(24, 52),
    s: rnd(5, 10), rot: rnd(0, 6.28), vr: rnd(-1.4, 1.4), ph: rnd(0, 6.28), fl: rnd(0, 6.28), c: pick(), burst: false
  });
  const burstPetal = (ox, oy) => {
    const a = -Math.PI / 2 + rnd(-1.4, 1.4), sp = rnd(220, 640);
    return { x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: rnd(6, 12), rot: rnd(0, 6.28),
             vr: rnd(-8, 8), ph: rnd(0, 6.28), fl: rnd(0, 6.28), c: pick(), burst: true };
  };
  function seedAmbient() {
    petals = petals.filter(p => p.burst);
    if (reduce) return;
    const n = Math.max(14, Math.min(34, Math.round(W / 38)));
    for (let i = 0; i < n; i++) petals.push(ambient(false));
  }
  function burst(ox, oy, n) {
    if (reduce) return;
    for (let i = 0; i < n; i++) petals.push(burstPetal(ox, oy));
  }
  function drawPetal(p) {
    px.save();
    px.translate(p.x, p.y); px.rotate(p.rot); px.scale(Math.cos(p.fl) * .8 + .2 * Math.sign(Math.cos(p.fl) || 1), 1);
    const s = p.s;
    px.globalAlpha = .92; px.fillStyle = p.c;
    px.beginPath();
    px.moveTo(0, -s);
    px.bezierCurveTo(s * .9, -s * .5, s * .7, s * .6, 0, s);
    px.bezierCurveTo(-s * .7, s * .6, -s * .9, -s * .5, 0, -s);
    px.fill();
    px.restore();
  }
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    px.clearRect(0, 0, W, H);
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      if (p.burst) {
        p.vy += 420 * dt; p.vx *= 1 - 1.6 * dt; p.vy *= 1 - .9 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.x += Math.sin(t * 2 + p.ph) * 16 * dt;
        if (p.y > H + 30) { petals.splice(i, 1); continue; }
      } else {
        p.y += p.vy * dt; p.x += Math.sin(t * .8 + p.ph) * 22 * dt;
        if (p.y > H + 20) { p.y = -20; p.x = rnd(0, W); }
      }
      p.rot += p.vr * dt; p.fl += dt * (p.burst ? 7 : 2.2);
      drawPetal(p);
    }
    requestAnimationFrame(frame);
  }
  sizeCanvas(); seedAmbient(); requestAnimationFrame(frame);

  /* =====================================================
     3) Kazı-kazan
  ===================================================== */
  const gift = $('#gift'), note = $('#note'), card = $('#card');
  const foil = $('#foil'), fx = foil.getContext('2d');
  const skipBtn = $('#skip'), replayBtn = $('#replay');
  const CELL = 14, BR = 24;
  let cw = 0, ch = 0, cols = 0, rows = 0, cells = null, count = 0, done = false, drawing = false, lastPt = null;

  function tulipPath() {
    const p = new Path2D();
    p.addPath(new Path2D('M-20,-6 C-26,-40 -10,-62 0,-72 C10,-62 26,-40 20,-6 C10,6 -10,6 -20,-6Z'));
    p.addPath(new Path2D('M-22,-8 C-30,-44 -14,-66 -4,-74 C-8,-50 -4,-20 6,2 C-6,6 -16,2 -22,-8Z'));
    p.addPath(new Path2D('M22,-8 C30,-44 14,-66 4,-74 C8,-50 4,-20 -6,2 C6,6 16,2 22,-8Z'));
    return p;
  }

  function paintFoil() {
    const g = fx.createLinearGradient(0, 0, cw, ch);
    g.addColorStop(0, '#b4b7c3'); g.addColorStop(.25, '#eef0f5'); g.addColorStop(.5, '#a8acb9');
    g.addColorStop(.75, '#f4f5f9'); g.addColorStop(1, '#b1b4c1');
    fx.globalCompositeOperation = 'source-over';
    fx.fillStyle = g; fx.fillRect(0, 0, cw, ch);

    for (let i = 0; i < cw * ch / 14; i++) {
      const v = 120 + Math.random() * 130 | 0;
      fx.fillStyle = `rgba(${v},${v},${v + 8},.12)`;
      fx.fillRect(Math.random() * cw, Math.random() * ch, 1.5, 1.5);
    }
    fx.strokeStyle = 'rgba(255,255,255,.14)'; fx.lineWidth = 1;
    for (let x = -ch; x < cw; x += 7) { fx.beginPath(); fx.moveTo(x, ch); fx.lineTo(x + ch, 0); fx.stroke(); }

    const tp = tulipPath();
    fx.fillStyle = 'rgba(105,110,132,.26)';
    for (let y = 26, r = 0; y < ch + 30; y += 44, r++)
      for (let x = (r % 2 ? 22 : 0) + 20; x < cw + 20; x += 44) {
        fx.save(); fx.translate(x, y); fx.scale(.2, .2); fx.fill(tp); fx.restore();
      }

    fx.textAlign = 'center'; fx.textBaseline = 'middle';
    fx.font = '700 ' + Math.round(Math.min(cw * .1, 46)) + 'px Caveat, "Segoe Script", cursive';
    fx.fillStyle = 'rgba(255,255,255,.7)'; fx.fillText('kazı', cw / 2 + 1.5, ch / 2 + 2);
    fx.fillStyle = 'rgba(70,74,96,.85)'; fx.fillText('kazı', cw / 2, ch / 2);
  }

  function setupFoil() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = card.offsetWidth; ch = card.offsetHeight;
    foil.width = cw * dpr; foil.height = ch * dpr;
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(cw / CELL); rows = Math.ceil(ch / CELL);
    cells = new Uint8Array(cols * rows); count = 0; done = false;
    foil.classList.remove('hide'); card.classList.remove('done'); note.classList.remove('done');
    paintFoil();
  }

  const fontReady = Promise.race([
    (document.fonts && document.fonts.load('700 40px Caveat')) || Promise.resolve(),
    new Promise(r => setTimeout(r, 1200))
  ]);

  function pt(e) { return { x: e.offsetX, y: e.offsetY }; }

  function mark(a, b) {
    const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 8));
    for (let i = 0; i <= steps; i++) {
      const x = a.x + (b.x - a.x) * i / steps, y = a.y + (b.y - a.y) * i / steps;
      const c0 = Math.max(0, Math.floor((x - BR) / CELL)), c1 = Math.min(cols - 1, Math.floor((x + BR) / CELL));
      const r0 = Math.max(0, Math.floor((y - BR) / CELL)), r1 = Math.min(rows - 1, Math.floor((y + BR) / CELL));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const k = r * cols + c;
        if (cells[k]) continue;
        const dx = (c + .5) * CELL - x, dy = (r + .5) * CELL - y;
        if (dx * dx + dy * dy <= BR * BR * .8) { cells[k] = 1; count++; }
      }
    }
    if (count / (cols * rows) >= .5) reveal();
  }

  function scratch(a, b) {
    fx.globalCompositeOperation = 'destination-out';
    fx.lineWidth = BR * 2; fx.lineCap = 'round'; fx.lineJoin = 'round';
    fx.beginPath(); fx.moveTo(a.x, a.y); fx.lineTo(b.x, b.y); fx.stroke();
    mark(a, b);
  }

  foil.addEventListener('pointerdown', e => {
    if (done) return;
    drawing = true; foil.setPointerCapture(e.pointerId);
    lastPt = pt(e); scratch(lastPt, lastPt); e.preventDefault();
  });
  foil.addEventListener('pointermove', e => {
    if (!drawing || done) return;
    const p = pt(e); scratch(lastPt, p); lastPt = p;
  });
  ['pointerup', 'pointercancel'].forEach(ev => foil.addEventListener(ev, () => { drawing = false; }));

  function reveal() {
    if (done) return;
    done = true; drawing = false;
    foil.classList.add('hide'); card.classList.add('done'); note.classList.add('done');
    const r = card.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 110);
    skipBtn.hidden = true; replayBtn.hidden = false;
  }

  /* ---------- akış ---------- */
  $('#open').addEventListener('click', () => {
    gift.classList.add('leave');
    const r = $('#open').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 40);
    setTimeout(async () => {
      gift.hidden = true; note.hidden = false;
      await fontReady;
      setupFoil();
    }, reduce ? 0 : 650);
  });
  skipBtn.addEventListener('click', reveal);
  replayBtn.addEventListener('click', () => {
    replayBtn.hidden = true; skipBtn.hidden = false; setupFoil();
  });

  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      sizeCanvas(); seedAmbient();
      if (!note.hidden && !done) setupFoil();
    }, 200);
  });
})();
</script>
</body>
</html>
